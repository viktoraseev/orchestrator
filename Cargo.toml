[package]
name = "orchestrator"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
signal-hook = "0.3"
thiserror = "2.0"

[dev-dependencies]
cucumber = "0.21"
tempfile = "3.20"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "config"
harness = false

[[test]]
name = "workflow_validation"
harness = false

[[test]]
name = "lifecycle"
harness = false

[[test]]
name = "run_inspection"
harness = false

[[test]]
name = "source_catalog"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
