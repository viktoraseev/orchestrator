steps:
  - id: route
    process:
      executable: /bin/sh
      args:
        - -c
        - |
          set -eu
          input_step=$(printf '%s\n' "$ORC_INPUT" | /usr/bin/sed -n 's/^- step-id: //p')
          input_id=$(printf '%s\n' "$ORC_INPUT" | /usr/bin/sed -n 's/^  input-id: //p')
          case "$input_step:$input_id" in
            :)
              : > "$2"
              ;;
            decision:fix)
              input_path=$(printf '%s\n' "$ORC_INPUT" | /usr/bin/sed -n 's/^  path: //p')
              /bin/cp "$input_path" "$1"
              ;;
            decision:repeat)
              : > "$2"
              ;;
            *)
              echo "error: route received unexpected input $input_step:$input_id" >&2
              exit 1
              ;;
          esac
        - route
        - "{{output:fix}}"
        - "{{output:repeat}}"
    human: false
    depends-on:
      - one-of:
          - step: decision
            output: fix
          - step: decision
            output: repeat
    outputs:
      - one-of: [fix, repeat]
  - id: implement-new
    agent: sol
    prompt: migrate-spec
    human: false
    depends-on:
      - step: route
        output: repeat
    outputs:
      - one-of: [review, done]
  - id: implement-fix
    agent: sol
    prompt: fix-migration
    human: false
    depends-on:
      - step: route
        output: fix
    outputs: [review]
  - id: review-input
    process:
      executable: /bin/sh
      args:
        - -c
        - |
          set -eu
          input_path=$(printf '%s\n' "$ORC_INPUT" | /usr/bin/sed -n 's/^  path: //p')
          if [ -z "$input_path" ]; then
            echo "error: review-input received no artifact" >&2
            exit 1
          fi
          /bin/cp "$input_path" "$1"
        - review-input
        - "{{output:review}}"
    human: false
    depends-on:
      - one-of:
          - step: implement-new
            output: review
          - step: implement-fix
            output: review
    outputs: [review]
  - id: review
    agent: sol
    prompt: review-migration
    human: true
    depends-on:
      - step: review-input
        output: review
    outputs:
      - one-of: [fix, accept]
  - id: commit
    process:
      executable: /bin/sh
      args:
        - -c
        - |
          set -eu
          /usr/bin/git add -A
          if /usr/bin/git diff --cached --quiet; then
            echo "error: migration batch has no changes to commit" >&2
            exit 1
          fi
          /usr/bin/git commit -F "$1"
        - commit
        - "{{path:review:accept}}"
    human: false
    depends-on:
      - step: review
        output: accept
    outputs: []
  - id: decision
    process:
      executable: /bin/sh
      args:
        - -c
        - |
          set -eu
          input_step=$(printf '%s\n' "$ORC_INPUT" | /usr/bin/sed -n 's/^- step-id: //p')
          input_id=$(printf '%s\n' "$ORC_INPUT" | /usr/bin/sed -n 's/^  input-id: //p')
          case "$input_step:$input_id" in
            implement-new:done)
              : > "$3"
              ;;
            review:fix)
              input_path=$(printf '%s\n' "$ORC_INPUT" | /usr/bin/sed -n 's/^  path: //p')
              /bin/cp "$input_path" "$1"
              ;;
            :)
              : > "$2"
              ;;
            *)
              echo "error: decision received unexpected input $input_step:$input_id" >&2
              exit 1
              ;;
          esac
        - decision
        - "{{output:fix}}"
        - "{{output:repeat}}"
        - "{{output:done}}"
    human: false
    depends-on:
      - one-of:
          - step: implement-new
            output: done
          - step: review
            output: fix
          - commit
    outputs:
      - one-of: [fix, repeat, done]
  - id: exit
    process:
      executable: /usr/bin/true
      args: []
    human: false
    depends-on:
      - step: decision
        output: done
    outputs: []
